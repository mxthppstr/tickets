<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tickets">
<meta name="theme-color" content="#F1EEF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/p_night-lavender.png">
<title>Ticket Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1EEF8; --surface:#FFFFFF; --ink:#2E2547; --muted:#655C80; --line:#DDD6EE;
  --ticket:#CDBEEE; --ticket-ink:#2A1F45; --plum:#6A55A8; --plum-soft:#E6DFF5; --slip:#A8455A; --slip-soft:#F7E1E6;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#252136; --ink:#ECE8F7; --muted:#A9A2C2; --line:#3A3452;
    --ticket:#B6A3E6; --ticket-ink:#1E1633; --plum:#B9A6F0; --plum-soft:#342D4D; --slip:#EE93A6; --slip-soft:#432834;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#252136; --ink:#ECE8F7; --muted:#A9A2C2; --line:#3A3452;
  --ticket:#B6A3E6; --ticket-ink:#1E1633; --plum:#B9A6F0; --plum-soft:#342D4D; --slip:#EE93A6; --slip-soft:#432834;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 110px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--plum);outline-offset:2px;border-radius:8px}

header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em}
.sync{font-size:13px;color:var(--muted)}

/* The ticket — the one bold element */
.ticket{position:relative;background:var(--ticket);color:var(--ticket-ink);padding:22px 34px 20px;margin-bottom:6px;
  -webkit-mask:radial-gradient(circle at 0 50%,transparent 15px,#000 15.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 15px,#000 15.5px) right/51% 100% no-repeat;
          mask:radial-gradient(circle at 0 50%,transparent 15px,#000 15.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 15px,#000 15.5px) right/51% 100% no-repeat;
  border-radius:6px}
.ticket::after{content:"";position:absolute;left:28px;right:28px;bottom:58px;border-top:2px dashed color-mix(in srgb,var(--ticket-ink) 30%,transparent)}
.bal{font-size:clamp(64px,20vw,104px);font-weight:800;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.bal-label{font-size:16px;font-weight:600;margin-top:6px}
.ticket-foot{display:flex;justify-content:space-between;gap:12px;margin-top:30px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.bump{animation:bump .5s ease-out}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.08)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.bump{animation:none}}

nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:4px;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:150px;border:0;background:none;padding:13px 4px;border-radius:12px;font-weight:600;font-size:15px;color:var(--muted)}
nav button[aria-current="page"]{background:var(--plum-soft);color:var(--ink)}

h2{font-size:18px;font-weight:800;margin:26px 0 4px}
.hint{font-size:14px;color:var(--muted);margin:0 0 12px}
.list{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;transition:background .15s}
.task:active{transform:translateY(1px)}
.task .name{flex:1}
.task .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pts{font-weight:800;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.pts.up{color:var(--plum)}
.pts.down{color:var(--slip)}
.task.slip{background:color-mix(in srgb,var(--slip-soft) 55%,transparent);border-color:transparent}
.task.done-today{border-color:var(--plum)}

.oneoff{display:flex;gap:8px;margin-top:10px}
.oneoff input[type=text]{flex:1;min-width:0}
input[type=text],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input[type=number]{width:76px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--plum);color:var(--surface)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--muted);font-size:14px;text-decoration:underline;padding:4px}

.prize{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.prize .name{flex:1}
.prize .cost{font-weight:800;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--plum-soft);border-radius:3px;margin-top:6px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--plum)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.trophy{background:var(--plum-soft);border-radius:12px;padding:12px 14px}
.trophy b{display:block}
.trophy small{color:var(--muted)}

.day{margin-top:18px}
.day h3{font-size:15px;font-weight:700;margin:0 0 6px;color:var(--muted)}
.entry{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.entry .name{flex:1}
.entry .note{display:block;font-size:13px;color:var(--muted)}

.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row input[type=text]{flex:1;min-width:0}
.settings{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.settings label{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.empty{color:var(--muted);font-size:15px;padding:8px 0}
.lastb{margin:0 0 12px;font-size:15px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:12px}
.sw{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 8px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600;font-size:14px}
.sw[aria-pressed="true"]{border-color:var(--plum)}
.chip{display:flex;align-items:center;justify-content:center;width:56px;height:40px;border-radius:8px;border:1px solid var(--line)}
.chip i{display:block;width:34px;height:20px;border-radius:4px}
.chip.icon{width:46px;height:46px;border-radius:11px}
.chip.icon i{width:30px;height:18px}
.icgroup{font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 6px}
.icongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.ic{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;border:2px solid transparent;border-radius:14px;background:none;font-size:12px;line-height:1.2;color:var(--muted);text-align:center}
.ic img{width:56px;height:56px;border-radius:13px;display:block}
.ic[aria-pressed="true"]{border-color:var(--plum);color:var(--ink);font-weight:700}
.iconcur{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.iconcur img{width:56px;height:56px;border-radius:13px;display:block}
.iconcur div{flex:1;min-width:0}
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:none;padding:11px 6px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--plum-soft);color:var(--ink)}
.wknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.wknav span{font-size:14px;color:var(--muted);text-align:center}
.wknav .btn{padding:8px 12px;white-space:nowrap}
.mv{display:flex;flex-direction:column;gap:3px;flex:none}
.mvb{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;width:32px;height:21px;padding:0;font-size:13px;line-height:1;font-weight:700}
.mvb:disabled{opacity:.3;cursor:default}
.review{background:var(--plum-soft);border-radius:12px;padding:14px 16px;margin-bottom:6px}
.review-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:17px}
.review-head b{font-weight:800}
.review-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.review-stats small{display:block;font-size:12px;color:var(--muted)}
.review-stats b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.review p{margin:0 0 8px;font-size:14px}
.review .hint{margin-bottom:12px}
.sub{display:block;font-size:13px;color:var(--muted);font-weight:400}
.stat-hero{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:4px}
.stat-hero b{display:block;font-size:48px;font-weight:800;line-height:1;color:var(--plum);font-variant-numeric:tabular-nums}
.stat-hero small,.stat small{display:block;font-size:13px;color:var(--muted)}
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.week{display:flex;align-items:flex-end;gap:6px;height:130px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.week span{display:block;width:100%;background:var(--ticket);border-radius:4px 4px 0 0;min-height:2px}
.toplist{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 14px}
.toplist div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.toplist div:last-child{border-bottom:0}
.toplist b{font-variant-numeric:tabular-nums}
.guide-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.guide{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}
.guide th,.guide td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
.guide tr:last-child td{border-bottom:0}
.guide th{font-size:13px;color:var(--muted);font-weight:600}
.guide td:first-child{font-weight:800;color:var(--plum);white-space:nowrap;font-variant-numeric:tabular-nums}
.guide td:last-child{color:var(--muted)}
.confirm{background:var(--slip-soft);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:15px}
.confirm p{margin:0 0 10px}

/* Collapsible drawers on Today */
.drawer{margin-top:18px}
.drawer summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 2px;font-size:18px;font-weight:800;border-bottom:1px solid var(--line)}
.drawer summary::-webkit-details-marker{display:none}
.drawer summary::after{content:"";width:9px;height:9px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(-45deg);transition:transform .2s;margin-left:4px}
.drawer[open] summary::after{transform:rotate(45deg)}
.drawer summary span:first-child{flex:1}
.sum-meta{font-size:14px;font-weight:600;color:var(--muted)}
.drawer[open] summary{margin-bottom:10px}
@media (prefers-reduced-motion: reduce){.drawer summary::after{transition:none}}

/* All tasks */
.alltasks{display:block;width:100%;margin-top:28px;background:none;border:2px dashed var(--line);border-radius:12px;padding:14px;font-weight:700;color:var(--ink)}
.back{border:0;background:none;color:var(--plum);font-weight:700;padding:6px 0;margin-bottom:4px}
.group{font-size:15px;font-weight:700;color:var(--muted);margin:16px 0 8px}
.task .status{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--plum-soft);color:var(--ink);white-space:nowrap}
.task.on .status{background:var(--plum);color:var(--surface)}
.task.slip.on .status{background:var(--slip);color:var(--surface)}

/* Keep drawer contents inside the screen (details content otherwise falls back to content-box) */
details>*{box-sizing:border-box}

/* App guide */
.gtypes{display:flex;flex-direction:column;gap:8px}
.gtype{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px}
.gtype b{display:block}
.gtype span{color:var(--muted)}

/* Drag to reorder */
.grip{flex:none;display:flex;align-items:center;justify-content:center;width:32px;align-self:stretch;min-height:42px;color:var(--muted);fill:currentColor;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab}
.row.dragging{position:relative;z-index:5;background:var(--surface);border-radius:10px;box-shadow:0 0 0 6px var(--surface),0 10px 26px rgba(0,0,0,.22)}
.row.dragging .grip{color:var(--plum);cursor:grabbing}
body.dragging-on{-webkit-user-select:none;user-select:none}

/* Pins and See all */
.seemore{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--plum);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.pin{flex:none;width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.pin svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.pin[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:var(--surface)}
.pin[aria-pressed="true"] svg{fill:currentColor}
.sortlist .row input[type=number]{width:58px}

/* After-midnight banner */
.late{background:var(--plum-soft);border-radius:12px;padding:12px 14px;margin-bottom:6px}
.late p{margin:0 0 10px;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Ticket Counter</h1><span class="sync" id="sync">Saved on this phone</span></header>

  <section class="ticket" aria-live="polite">
    <div class="bal" id="bal">0</div>
    <div class="bal-label">tickets to spend</div>
    <div class="ticket-foot"><span id="today">Today +0</span><span id="life"></span></div>
  </section>

  <nav aria-label="Sections">
    <button data-view="today" aria-current="page">Today</button>
    <button data-view="prizes">Prizes</button>
    <button data-view="stats">Stats</button>
    <button data-view="settings">Settings</button>
  </nav>

  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
const KEY='ticket-counter-v1';
const uid=()=>Math.random().toString(36).slice(2,10);
const calKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const DAY_START=6; // anything logged before 6am counts toward the previous day
function advancedToday(d){ let adv=null; try{ adv=state.settings.advancedDay; }catch(e){} return adv===calKey(d); }
function nowDay(){ const d=new Date(); if(d.getHours()<DAY_START&&!advancedToday(d)) d.setDate(d.getDate()-1); return d; }
function isLateNight(){ const d=new Date(); return d.getHours()<DAY_START&&!advancedToday(d); }
const dayKey=(d=nowDay())=>calKey(d);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function defaults(){
  return {
    v:1, updatedAt:Date.now(),
    settings:{slips:true, dailyCap:9},
    tasks:[
      {id:uid(),name:'Did my paper check-in',pts:3,kind:'good'},
      {id:uid(),name:'Got outside',pts:3,kind:'good'},
      {id:uid(),name:'Called or texted a friend',pts:2,kind:'good'},
      {id:uid(),name:'Tidied one space',pts:3,kind:'good'},
      {id:uid(),name:'Handled one admin thing',pts:5,kind:'good'},
      {id:uid(),name:'One focused hour on a big project',pts:10,kind:'good'},
      {id:uid(),name:'Lost an hour to scrolling',pts:1,kind:'slip'},
      {id:uid(),name:'Stayed up way too late',pts:2,kind:'slip'}
    ],
    rewards:[
      {id:uid(),name:'Fancy coffee run',cost:15,type:'shop'},
      {id:uid(),name:'Guilt-free movie night',cost:25,type:'shop'},
      {id:uid(),name:'Small treat purchase',cost:60,type:'shop'},
      {id:uid(),name:'First 100 tickets',cost:100,type:'milestone',earnedAt:null},
      {id:uid(),name:'Something I’ve been wanting',cost:250,type:'milestone',earnedAt:null},
      {id:uid(),name:'500 club',cost:500,type:'milestone',earnedAt:null}
    ],
    log:[],        // {id, ts, day, name, pts, kind, note}
    spent:[]       // {id, ts, day, name, cost}
  };
}

let state;
try{ const raw=localStorage.getItem(KEY); state=raw?JSON.parse(raw):defaults(); }catch(e){ state=defaults(); }
let view='today';
const open={good:true,slip:true,add:true,tasks:false,rewards:false,rules:false,backup:false,guide:false,big:true,lastweek:false,appearance:false};
function lastSundayKey(){ const d=nowDay(); d.setDate(d.getDate()-d.getDay()); return dayKey(d); }
function weekTiles(sun){
  const range=(from,to)=>{ let e=0,slips=0; const ds=new Set(); state.log.forEach(x=>{ const a=daysBetween(x.day,sun); if(a>=from&&a<=to){ if(x.pts>0) e+=x.pts; if(x.kind==='slip') slips++; ds.add(x.day); } }); return {e,slips,days:ds.size}; };
  const w=range(1,7), p=range(8,14);
  const avg=w.days?Math.round(w.e/w.days):0, diff=w.e-p.e;
  const spent=state.spent.filter(s=>{ const a=daysBetween(s.day,sun); return a>=1&&a<=7; }).length;
  return `<div class="review"><div class="review-stats" style="margin-top:0"><div><small>Past 7 days</small><b>+${w.e}</b></div><div><small>Average day</small><b>+${avg}</b></div><div><small>vs. week before</small><b>${diff>=0?'+':'−'}${Math.abs(diff)}</b></div></div>
    <p style="margin:0">${w.days} ${w.days===1?'day':'days'} logged · ${w.slips} ${w.slips===1?'slip-up':'slip-ups'} · ${spent} ${spent===1?'prize':'prizes'} redeemed</p></div>`;
}
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/86400000);
const EARLY_MAX=5;
let pendingRestore=null;
const VARS=['bg','surface','ink','muted','line','ticket','ticket-ink','plum','plum-soft','slip','slip-soft'];
const PALETTES={
  lavender:{name:'Lavender',light:['#F1EEF8','#FFFFFF','#2E2547','#655C80','#DDD6EE','#CDBEEE','#2A1F45','#6A55A8','#E6DFF5','#A8455A','#F7E1E6'],dark:['#1A1726','#252136','#ECE8F7','#A9A2C2','#3A3452','#B6A3E6','#1E1633','#B9A6F0','#342D4D','#EE93A6','#432834']},
  sage:{name:'Sage',light:['#EEF3EF','#FFFFFF','#1E3A32','#5A7068','#CFDDD4','#8ED1B2','#123328','#2E7A62','#DCEBE2','#B04A41','#F6E1DD'],dark:['#14201C','#1D2B26','#E6F0EB','#9DB3AA','#2F423B','#7CC3A3','#0E2A20','#7CCBAA','#29413A','#EE958B','#3E2826']},
  peach:{name:'Peach',light:['#FBF1EA','#FFFFFF','#3A2A22','#6B5547','#EEDDD0','#F6C7A6','#4A2814','#A8562A','#F6E2D4','#9C3F55','#F6E3E8'],dark:['#221915','#2E221D','#F5EAE3','#BBA597','#47372F','#E9B08A','#2E1A0C','#F0A77C','#4A3327','#EE95AA','#45282F']},
  blue:{name:'Powder blue',light:['#EEF4FA','#FFFFFF','#15263D','#4A5D75','#D3E0EC','#BCD8F2','#15304D','#2F6AA3','#DDE9F5','#A8404D','#F7E5E8'],dark:['#131B26','#1C2633','#E7EEF6','#A0B0C4','#2F3D50','#8FBBE6','#0F2236','#8CBDEF','#263A52','#EE929E','#3E262C']},
  blush:{name:'Blush',light:['#FBEFF2','#FFFFFF','#40202C','#6E5560','#EED8DF','#F4C6D3','#4A1F2E','#A23F66','#F5DFE6','#8F5420','#F3E6DA'],dark:['#24171C','#301F26','#F6E8ED','#C2A6B1','#4A3039','#E5A7BA','#33121F','#F09BBB','#4A2B37','#E8B07A','#3F2E20']}
};
const mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
let curMode='light';
function applyLook(){
  const s=state.settings||{}, p=PALETTES[s.palette]||PALETTES.lavender;
  curMode=(s.theme==='light'||s.theme==='dark')?s.theme:(mq&&mq.matches?'dark':'light');
  const r=document.documentElement;
  if(s.theme==='light'||s.theme==='dark') r.setAttribute('data-theme',s.theme); else r.removeAttribute('data-theme');
  p[curMode].forEach((c,i)=>r.style.setProperty('--'+VARS[i],c));
  if(curMode==='dark') r.style.setProperty('--bg','#000000');
  const ik=(s.icon&&PALETTES[s.icon])?s.icon:(PALETTES[s.palette]?s.palette:'lavender');
  let ln=document.querySelector('link[rel="apple-touch-icon"]');
  if(!ln){ ln=document.createElement('link'); ln.rel='apple-touch-icon'; document.head.appendChild(ln); }
  ln.setAttribute('href','icons/'+(s.iconDesign||'p_night')+'-'+ik+'.png');
  r.style.colorScheme=curMode;
}
if(mq){ const onChange=()=>{ applyLook(); if(view==='settings') render(); }; if(mq.addEventListener) mq.addEventListener('change',onChange); else if(mq.addListener) mq.addListener(onChange); }
let lastAdd=null, addTypeMem=null; // remembered only while you stay in Settings
let weekOff=0;
function agoText(ts){
  const start=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x.getTime();};
  const days=Math.round((start(Date.now())-start(ts))/86400000);
  return days<=0?'today':days===1?'yesterday':days+' days ago';
}
let textMode=null;
function backupText(){ return JSON.stringify({app:'ticket-counter',exportedAt:Date.now(),state},null,2); }
function canShareFiles(){ try{ return !!(navigator.canShare&&navigator.canShare({files:[new File(['{}'],'t.json',{type:'application/json'})]})); }catch(e){ return false; } }
async function shareBackup(){
  const f=new File([backupText()],'ticket-counter-backup-'+dayKey()+'.json',{type:'application/json'});
  try{ await navigator.share({files:[f]}); state.settings.lastBackup=Date.now(); persist(); render(); toast('Backup saved'); }
  catch(e){ if(e&&e.name==='AbortError') return; toast('Couldn\u2019t open the share sheet. Try Download backup.'); }
}
function backup(){
  try{
    const blob=new Blob([backupText()],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='ticket-counter-backup-'+dayKey()+'.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    state.settings.lastBackup=Date.now(); persist(); render(); toast('Backup downloading. If no file appears, use \u201cShow backup text\u201d.');
  }catch(e){ textMode='show'; render(); toast('Download blocked here. Copy the text instead.'); }
}
function loadBackupText(txt){
  try{
    const raw=JSON.parse(txt);
    const data=raw&&raw.state?raw.state:raw;
    if(!data||!Array.isArray(data.tasks)||!Array.isArray(data.rewards)||!Array.isArray(data.log)) throw new Error('bad');
    if(!Array.isArray(data.spent)) data.spent=[];
    pendingRestore={data,exportedAt:raw.exportedAt||data.updatedAt||null,entries:data.log.length};
    textMode=null; open.backup=true; render();
  }catch(e){ toast('That isn\u2019t a Ticket Counter backup'); }
}
async function readBackup(file){
  try{
    loadBackupText(await file.text());
  }catch(e){ toast('That file isn’t a Ticket Counter backup'); }
}

/* ---------- derived ---------- */
const sum=(a,f)=>a.reduce((n,x)=>n+f(x),0);
const balance=()=>sum(state.log,e=>e.pts)-sum(state.spent,s=>s.cost);
const lifetime=()=>sum(state.log,e=>e.pts>0?e.pts:0);
const todayLog=()=>state.log.filter(e=>e.day===dayKey());
const todayNet=()=>sum(todayLog(),e=>e.pts);
const todaySlipLoss=()=>-sum(todayLog().filter(e=>e.pts<0),e=>e.pts);

/* ---------- persistence: this phone only ---------- */
function persist(){
  state.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
}

/* ---------- actions ---------- */
const toastEl=document.getElementById('toast'); let tt;
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>toastEl.classList.remove('show'),2600); }

function checkMilestones(){
  const life=lifetime(); let hit=null;
  state.rewards.forEach(r=>{ if(r.type==='milestone'&&!r.earnedAt&&life>=r.cost){ r.earnedAt=Date.now(); hit=r; } });
  return hit;
}
function logGood(name,pts){
  state.log.push({id:uid(),ts:Date.now(),day:dayKey(),name,pts,kind:'good'});
  const hit=checkMilestones(); persist(); render(true);
  toast(hit?('Milestone unlocked: '+hit.name):('+'+pts+' tickets'));
}
function logSlip(task){
  const room=Math.max(0,state.settings.dailyCap-todaySlipLoss());
  const loss=Math.min(task.pts,room,Math.max(0,balance()));
  const note=loss<task.pts?(room<task.pts?'Daily limit reached':'Balance can’t go below zero'):'';
  state.log.push({id:uid(),ts:Date.now(),day:dayKey(),name:task.name,pts:-loss,kind:'slip',note});
  persist(); render(true);
  toast(loss>0?('Noted, −'+loss+'. Tomorrow’s a new ticket.'):'Noted. No tickets lost today.');
}
function redeem(r){
  if(balance()<r.cost) return;
  state.spent.push({id:uid(),ts:Date.now(),day:dayKey(),name:r.name,cost:r.cost});
  persist(); render(true); toast('Enjoy it: '+r.name);
}
function undo(id){
  const en=state.log.find(e=>e.id===id);
  if(en&&en.bountyId){ const b=(state.bounties||[]).find(x=>x.id===en.bountyId); if(b) b.doneTs=null; }
  if(en&&en.goalId){ const g=(state.goals||[]).find(x=>x.id===en.goalId); if(g) g.days=g.days.filter(d=>d!==en.day); }
  state.log=state.log.filter(e=>e.id!==id); state.spent=state.spent.filter(e=>e.id!==id);
  // milestones stay earned once earned only if still at or above threshold
  const life=lifetime(); state.rewards.forEach(r=>{ if(r.type==='milestone'&&r.earnedAt&&life<r.cost) r.earnedAt=null; });
  persist(); render();
}

/* ---------- render ---------- */
function header(bump){
  const b=document.getElementById('bal'); b.textContent=balance();
  if(bump){ b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }
  const t=todayNet(); document.getElementById('today').textContent='Today '+(t>=0?'+':'−')+Math.abs(t);
  document.getElementById('life').textContent=nowDay().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  document.querySelectorAll('nav button').forEach(n=>{ if(n.dataset.view===(view==='all'?'today':(view==='history'||view==='icons')?'settings':view)) n.setAttribute('aria-current','page'); else n.removeAttribute('aria-current'); });
}

function pinNew(k){ return state.tasks.some(t=>t.kind===k&&t.pinned); }
function lateBanner(){
  if(!isLateNight()) return '';
  const fmt=d=>d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  return `<section class="late" aria-label="After midnight"><p>It’s after midnight, so anything you log still counts toward <b>${fmt(nowDay())}</b> until 6am.</p><button class="btn" data-advance="1">Start ${fmt(new Date())} now</button></section>`;
}
const showAll={good:false,slip:false};
function vToday(){
  const counts={}; todayLog().forEach(e=>counts[e.name]=(counts[e.name]||0)+1);
  const good=state.tasks.filter(t=>t.kind==='good'), slips=state.tasks.filter(t=>t.kind==='slip');
  // Pinned items show by default; anything already logged today stays visible too. No pins = show everything.
  const pick=(arr,kind)=>{ const n=arr.filter(t=>t.pinned).length; if(!n) return {items:arr,mode:'none',n}; if(showAll[kind]) return {items:arr,mode:'all',n}; return {items:arr.filter(t=>t.pinned||counts[t.name]),mode:'pinned',n}; };
  const more=(kind,p,total)=>p.mode==='none'?'':`<button class="seemore" data-seemore="${kind}">${p.mode==='all'?'Pinned only':'See all '+total}</button>`;
  const G=pick(good,'good');
  let h=lateBanner()+vReview()+`<details class="drawer" data-drawer="good" ${open.good?'open':''}><summary><span>Did something good</span>${G.mode==='none'?`<span class="sum-meta">${good.length} tasks</span>`:''}${more('good',G,good.length)}</summary><div class="list">`;
  h+=good.length?G.items.map(t=>`<button class="task${counts[t.name]?' done-today':''}" data-good="${t.id}"><span class="name">${esc(t.name)}</span>${counts[t.name]?`<span class="count">×${counts[t.name]}</span>`:''}<span class="pts up">+${t.pts}</span></button>`).join(''):'<p class="empty">Add a few tasks in Settings to get started.</p>';
  h+='</div>';
  if(G.mode==='none'&&good.length>8) h+='<p class="hint" style="margin-top:8px">Tip: pin your go-to tasks in Settings → Edit tasks to keep this list short.</p>';
  h+='<div class="oneoff"><input type="text" id="ooName" placeholder="Something else I did" aria-label="One-off task"><input type="number" id="ooPts" min="1" max="50" value="3" aria-label="Tickets"><button class="btn" id="ooAdd">Log</button></div></details>';
  if(state.settings.slips){
    const left=Math.max(0,state.settings.dailyCap-todaySlipLoss()), S=pick(slips,'slip');
    h+=`<details class="drawer" data-drawer="slip" ${open.slip?'open':''}><summary><span>Slipped up</span><span class="sum-meta">${left} left${S.mode==='none'?' to lose today':''}</span>${more('slip',S,slips.length)}</summary><div class="list">`;
    h+=slips.length?S.items.map(t=>`<button class="task slip" data-slip="${t.id}"><span class="name">${esc(t.name)}</span>${counts[t.name]?`<span class="count">×${counts[t.name]}</span>`:''}<span class="pts down">−${t.pts}</span></button>`).join(''):'<p class="empty">No slip-ups set up.</p>';
    h+='</div></details>';
  }
  h+=vBig();
  h+='<button class="alltasks" data-go="all">See all tasks</button>';
  return h;
}

function vReview(){
  const today=dayKey();
  if(nowDay().getDay()!==0||state.settings.reviewedDay===today) return '';
  const range=(from,to)=>{ let e=0,slips=0; const ds=new Set(); state.log.forEach(x=>{ const a=daysBetween(x.day,today); if(a>=from&&a<=to){ if(x.pts>0) e+=x.pts; if(x.kind==='slip') slips++; ds.add(x.day); } }); return {e,slips,days:ds.size}; };
  const w=range(1,7), p=range(8,14);
  const avg=w.days?Math.round(w.e/w.days):0, diff=w.e-p.e;
  const spent=state.spent.filter(s=>{ const a=daysBetween(s.day,today); return a>=1&&a<=7; }).length;
  const vs=p.e?(diff>=0?'+':'−')+Math.abs(diff):'—';
  return `<section class="review" aria-label="Sunday check-in"><div class="review-head"><b>Sunday check-in</b><button class="link" data-review="done">Done for this week</button></div>
    <div class="review-stats"><div><small>Past 7 days</small><b>+${w.e}</b></div><div><small>Average day</small><b>+${avg}</b></div><div><small>vs. week before</small><b>${vs}</b></div></div>
    <p>${w.days} ${w.days===1?'day':'days'} logged · ${w.slips} ${w.slips===1?'slip-up':'slip-ups'} · ${spent} ${spent===1?'prize':'prizes'} redeemed</p>
    <p class="hint">Quick checks: averaging well over 25 a day? Trim the easy stuff. Earning but not redeeming? Prizes are too pricey or not things you want. Hitting the slip cap most days? Rethink the slip list.</p>
    <button class="btn ghost" data-guide="open">Open pricing guide</button></section>`;
}

function vBig(){
  const today=dayKey(), ob=state.bounties.filter(b=>!b.doneTs);
  let h=`<details class="drawer" data-drawer="big" ${open.big?'open':''}><summary><span>Bounties and goals</span><span class="sum-meta">${ob.length} bounties · ${state.goals.length} goals</span></summary>`;
  if(!ob.length&&!state.goals.length) return h+'<p class="empty">Add a bounty for a hard one-time thing, or a goal you’re working on, in Settings → Add something.</p></details>';
  if(ob.length){
    h+='<h3 class="group">Bounties</h3><div class="list">'+ob.map(b=>{
      const age=Math.max(0,daysBetween(b.addedDay,today)), bonus=Math.max(0,EARLY_MAX-age);
      return `<button class="task" data-bounty="${b.id}"><span class="name">${esc(b.name)}<span class="sub">${age===0?'Added today':age===1?'Waiting 1 day':'Waiting '+age+' days'}${bonus?' · +'+bonus+' early bonus':''}</span></span><span class="pts up">+${b.pts+bonus}</span></button>`;
    }).join('')+'</div>';
  }
  if(state.goals.length){
    h+='<h3 class="group">Goals</h3><div class="list">'+state.goals.map(g=>{
      const done=g.days.includes(today), n=g.days.length;
      return `<button class="task${done?' done-today':''}" data-goal="${g.id}"><span class="name">${esc(g.name)}<span class="sub">Worked on it ${n} ${n===1?'day':'days'}</span></span>${done?'<span class="status">Done today</span>':`<span class="pts up">+${g.pts}</span>`}</button>`;
    }).join('')+'</div>';
  }
  return h+'</details>';
}

function vStats(){
  const L=state.log, by=k=>L.filter(e=>e.kind===k), pos=a=>sum(a,e=>Math.max(0,e.pts));
  const goodE=pos(by('good')), bountyE=pos(by('bounty')), goalE=pos(by('goal'));
  const slipL=-sum(by('slip'),e=>Math.min(0,e.pts)), spentT=sum(state.spent,s=>s.cost);
  const dayMap={}; L.forEach(e=>{dayMap[e.day]=(dayMap[e.day]||0)+Math.max(0,e.pts);});
  const days=Object.keys(dayMap), best=days.reduce((b,d)=>!b||dayMap[d]>dayMap[b]?d:b,null);
  const avg=days.length?Math.round(lifetime()/days.length):0;
  const count=a=>{const m={}; a.forEach(e=>m[e.name]=(m[e.name]||0)+1); return Object.entries(m).sort((x,y)=>y[1]-x[1]);};
  const topGood=count(by('good')).slice(0,3), topSlip=count(by('slip')).slice(0,1);
  const fmt=d=>new Date(d+'T12:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
  const card=(label,val,note)=>`<div class="stat"><small>${label}</small><b>${val}</b>${note?`<small>${note}</small>`:''}</div>`;
  const week=[]; for(let i=6;i>=0;i--){ const d=nowDay(); d.setDate(d.getDate()-i); const k=dayKey(d); week.push({k,v:dayMap[k]||0,l:d.toLocaleDateString(undefined,{weekday:'narrow'})}); }
  const wmax=Math.max(1,...week.map(w=>w.v));
  let h='<h2 style="margin-top:4px">Stats</h2>';
  h+=`<div class="stat-hero"><small>All-time tickets earned</small><b>${lifetime()}</b></div>`;
  h+='<div class="stat-grid">'+card('From good things','+'+goodE,by('good').length+' logged')+card('Lost to slip-ups','−'+slipL,by('slip').length+' logged')+card('From bounties','+'+bountyE,state.bounties.filter(b=>b.doneTs).length+' claimed')+card('From goals','+'+goalE,sum(state.goals,g=>g.days.length)+' days worked')+card('Spent on prizes',spentT,state.spent.length+' redeemed')+card('Milestones',state.rewards.filter(r=>r.type==='milestone'&&r.earnedAt).length,'unlocked')+card('Days logged',days.length,'')+card('Average day','+'+avg,'on days you logged')+(best?card('Best day','+'+dayMap[best],fmt(best)):'')+'</div>';
  h+='<h2>Last 7 days</h2><div class="week">'+week.map(w=>`<div title="${w.k}">${w.v||''}<span style="height:${Math.round(w.v/wmax*80)}px"></span>${w.l}</div>`).join('')+'</div>';
  if(topGood.length) h+='<h2>Most-logged good things</h2><div class="toplist">'+topGood.map(([n,c])=>`<div><span>${esc(n)}</span><b>×${c}</b></div>`).join('')+'</div>';
  if(topSlip.length) h+='<h2>Most common slip-up</h2><div class="toplist">'+topSlip.map(([n,c])=>`<div><span>${esc(n)}</span><b>×${c}</b></div>`).join('')+'</div>';
  return h;
}

  const icoSel=(state.settings.icon&&PALETTES[state.settings.icon])?state.settings.icon:'match';
  const ick=icoSel==='match'?pal:icoSel, dsel=state.settings.iconDesign||'p_night', ID=window.ICON_DATA||{designs:[],thumbs:{}};
  const icoBtn=(k,label,p)=>`<button class="sw" data-icon="${k}" aria-pressed="${icoSel===k}"><span class="chip icon" style="background:${p.light[0]}"><i style="background:${p.light[5]}"></i></span>${label}</button>`;
  let h='<button class="back" data-go="settings">\u2039 Back to Settings</button><h2 style="margin-top:4px">Home screen icon</h2><p class="hint">Changing the icon means re-adding the app to your home screen. The steps are in Settings \u2192 Appearance.</p>';

    h+=`<button class="ic" data-icon-design="${dz.id}" aria-pressed="${dsel===dz.id}"><img src="${ID.thumbs[dz.id+'-'+ick]||''}" alt="">${esc(dz.name)}</button>`; });

function vAll(){
  const has=(name,kind)=>state.tasks.some(t=>t.name===name&&t.kind===kind);
  const row=(name,pts,kind,ref)=>{const on=has(name,kind);return `<button class="task${kind==='slip'?' slip':''}${on?' on':''}" ${ref} aria-pressed="${on}"><span class="name">${esc(name)}</span><span class="pts ${kind==='slip'?'down':'up'}">${kind==='slip'?'−':'+'}${pts}</span><span class="status">${on?'On my list':'Add'}</span></button>`;};
  let h='<button class="back" data-go="today">‹ Back to Today</button><h2 style="margin-top:4px">All tasks</h2><p class="hint">Tap to add a task to your Today lists, tap again to take it off. Change ticket values in Settings.</p>';
  CATALOG.forEach((c,ci)=>{
    if(c.g==='Slip-ups'&&!state.settings.slips) return;
    h+=`<h3 class="group">${c.g}</h3><div class="list">`+c.items.map((it,ii)=>{const mine=state.tasks.find(t=>t.name===it[0]&&t.kind===c.kind);return row(it[0],mine?mine.pts:it[1],c.kind,`data-cat="${ci}:${ii}"`);}).join('')+'</div>';
  });
  const inCat=(t)=>CATALOG.some(c=>c.kind===t.kind&&c.items.some(it=>it[0]===t.name));
  const custom=state.tasks.filter(t=>!inCat(t)&&(t.kind==='good'||state.settings.slips));
  if(custom.length) h+='<h3 class="group">My own</h3><div class="list">'+custom.map(t=>row(t.name,t.pts,t.kind,`data-mine="${t.id}"`)).join('')+'</div><p class="hint" style="margin-top:8px">Taking one of your own off deletes it. You can add new ones in Settings.</p>';
  return h;
}

function vPrizes(){
  const bal=balance(), life=lifetime();
  const shop=state.rewards.filter(r=>r.type==='shop'), ms=state.rewards.filter(r=>r.type==='milestone').sort((a,b)=>a.cost-b.cost);
  let h='<h2>Spend tickets</h2><p class="hint">Spending doesn’t touch your all-time total or milestones.</p><div class="list">';
  h+=shop.length?shop.map(r=>`<div class="prize"><span class="name">${esc(r.name)}</span><span class="cost">${r.cost}</span><button class="btn" data-redeem="${r.id}" ${bal<r.cost?'disabled':''}>Redeem</button></div>`).join(''):'<p class="empty">Add prizes in Settings.</p>';
  h+='</div>';
  const earned=ms.filter(r=>r.earnedAt), next=ms.filter(r=>!r.earnedAt);
  h+='<h2>Milestones</h2><p class="hint">Unlock automatically from all-time tickets. Slip-ups never take these away.</p>';
  if(earned.length) h+='<div class="shelf">'+earned.map(r=>`<div class="trophy"><b>${esc(r.name)}</b><small>${r.cost} tickets · ${new Date(r.earnedAt).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</small></div>`).join('')+'</div>';
  h+='<div class="list" style="margin-top:8px">'+next.map(r=>`<div class="prize" style="display:block"><div style="display:flex;justify-content:space-between;gap:12px"><span>${esc(r.name)}</span><span class="cost">${life} / ${r.cost}</span></div><div class="bar"><span style="width:${Math.min(100,life/r.cost*100)}%"></span></div></div>`).join('')+'</div>';
  if(!ms.length) h+='<p class="empty">No milestones yet.</p>';
  return h;
}

function vHistory(){
  return '<button class="back" data-go="settings">‹ Back to Settings</button><h2 style="margin-top:4px">History</h2>'+vHistoryBody();
}
function vHistoryBody(){
  const all=[...state.log.map(e=>({...e,t:'log'})),...state.spent.map(s=>({...s,pts:-s.cost,t:'spent'}))].sort((a,b)=>b.ts-a.ts);
  if(!all.length) return '<p class="empty" style="margin-top:20px">Nothing logged yet. Your first tap on Today shows up here.</p>';
  const days={}; all.forEach(e=>(days[e.day]=days[e.day]||[]).push(e));
  return Object.keys(days).sort().reverse().slice(0,60).map(d=>{
    const label=d===dayKey()?'Today':new Date(d+'T12:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
    const net=sum(days[d].filter(e=>e.t==='log'),e=>e.pts);
    return `<div class="day"><h3>${label} · ${net>=0?'+':'−'}${Math.abs(net)}</h3>`+days[d].map(e=>`<div class="entry"><span class="name">${e.t==='spent'?'Redeemed: ':''}${esc(e.name)}${e.note?`<span class="note">${esc(e.note)}</span>`:''}</span><span class="pts ${e.pts>=0?'up':'down'}">${e.pts>=0?'+':'−'}${Math.abs(e.pts)}</span><button class="link" data-undo="${e.id}" aria-label="Remove ${esc(e.name)}">Remove</button></div>`).join('')+'</div>';
  }).join('');

/* ---------- drag to reorder (Settings) ---------- */
let drag=null;
function dragTick(){
  if(!drag) return;
  const edgeTop=90, edgeBot=window.innerHeight-120; let sp=0;
  if(drag.cy<edgeTop) sp=-Math.ceil((edgeTop-drag.cy)/6);
  else if(drag.cy>edgeBot) sp=Math.ceil((drag.cy-edgeBot)/6);
  if(sp){ window.scrollBy(0,sp); dragMove(); }
  drag.raf=requestAnimationFrame(dragTick);
}
function dragMove(){
  const d=drag, row=d.row; let dy=d.cy+window.scrollY-d.startY;
  for(;;){
    const center=row.offsetTop+dy+row.offsetHeight/2;
    const nx=row.nextElementSibling, pv=row.previousElementSibling;
    if(nx&&center>nx.offsetTop+nx.offsetHeight/2){ const b=row.offsetTop; d.box.insertBefore(nx,row); const shift=row.offsetTop-b; d.startY+=shift; dy-=shift; continue; }
    if(pv&&center<pv.offsetTop+pv.offsetHeight/2){ const b=row.offsetTop; d.box.insertBefore(row,pv); const shift=row.offsetTop-b; d.startY+=shift; dy-=shift; continue; }
    break;
  }
  row.style.transform=`translateY(${dy}px)`;
}
function dragEnd(){
  const d=drag; if(!d) return; drag=null; cancelAnimationFrame(d.raf);
  d.row.classList.remove('dragging'); d.row.style.transform=''; document.body.classList.remove('dragging-on');
  const ids=[...d.box.querySelectorAll('[data-grip]')].map(x=>x.dataset.grip.split(':')[1]);
  if(ids.join()===d.before) return;
  const a=state[d.arr], byId={}; a.forEach(x=>byId[x.id]=x);
  const slots=[]; a.forEach((x,i)=>{ if(ids.includes(x.id)) slots.push(i); });
  slots.forEach((pos,k)=>{ a[pos]=byId[ids[k]]; });
  persist(); render();
}
V.addEventListener('pointerdown',e=>{
  const g=e.target.closest('.grip'); if(!g||drag) return;
  const row=g.closest('.row'), box=row&&row.parentElement; if(!box) return;
  e.preventDefault(); try{g.setPointerCapture(e.pointerId);}catch(_){}
  if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();
  const arr=g.dataset.grip.split(':')[0];
  drag={row,box,arr,id:e.pointerId,startY:e.clientY+window.scrollY,cy:e.clientY,before:[...box.querySelectorAll('[data-grip]')].map(x=>x.dataset.grip.split(':')[1]).join()};
  row.classList.add('dragging'); document.body.classList.add('dragging-on');
  drag.raf=requestAnimationFrame(dragTick);
});
V.addEventListener('pointermove',e=>{ if(!drag||e.pointerId!==drag.id) return; e.preventDefault(); drag.cy=e.clientY; dragMove(); });
V.addEventListener('pointerup',e=>{ if(drag&&e.pointerId===drag.id) dragEnd(); });
V.addEventListener('pointercancel',e=>{ if(drag&&e.pointerId===drag.id) dragEnd(); });
// iPhone: stop the page from scrolling (and cancelling the drag) while a handle is held
V.addEventListener('touchstart',e=>{ if(e.target.closest&&e.target.closest('.grip')) e.preventDefault(); },{passive:false});

  if(el.dataset.edit){ const [arr,id,field]=el.dataset.edit.split(':'); const item=state[arr].find(x=>x.id===id); if(!item) return;
    if(field==='name'){ const v=el.value.trim(); if(v) item.name=v; else el.value=item.name; }
    else { const n=parseInt(el.value,10); if(n>0) item[field]=n; else el.value=item[field];
      if(arr==='rewards'&&item.type==='milestone'){ if(item.earnedAt&&lifetime()<item.cost) item.earnedAt=null; checkMilestones(); } }
    persist();
  }
  if(el.id==='restoreFile'){ const f=el.files&&el.files[0]; if(f) readBackup(f); el.value=''; return; }
  if(el.id==='addType'){ addTypeMem=el.value; return; }
  if(el.id==='setSlips'){ state.settings.slips=el.checked; persist(); }
  if(el.id==='setCap'){ const n=Math.max(0,Math.min(20,parseInt(el.value,10)||0)); state.settings.dailyCap=n; el.value=n; persist(); }
});
V.addEventListener('toggle',e=>{ const d=e.target; if(d.dataset&&d.dataset.drawer) open[d.dataset.drawer]=d.open; },true);
V.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.target.id==='ooName'||e.target.id==='ooPts')) document.getElementById('ooAdd').click(); });

render();
})();
</script>
</body>
</html>
